name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?color_snake=%23ef4444&color_dots=%23ebedf0,%23fecaca,%23f87171,%23ef4444,%23b91c1c
            dist/contribution-snake-dark.svg?color_snake=%23f87171&color_dots=%23161b22,%237f1d1d,%23b91c1c,%23dc2626,%23ef4444

      - name: Publish generated snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}